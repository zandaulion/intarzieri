<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    Notification badge. Android draws this from the alpha channel alone, as a
    flat silhouette in the system tint, so it must be a transparent-background
    shape rather than the app icon — a full-colour rounded square is opaque
    edge to edge and comes out as a featureless block.

    The window is a genuine hole (fill-rule evenodd), which is what stops the
    carriage reading as a plain rectangle at ~18dp.
  -->
  <g fill="#FFFFFF">
    <!-- Carriage with the window cut out of it. -->
    <path fill-rule="evenodd" d="
      M32,14 h32 a12,12 0 0 1 12,12 v34 a12,12 0 0 1 -12,12 h-32
      a12,12 0 0 1 -12,-12 v-34 a12,12 0 0 1 12,-12 z
      M31,28 h34 a3,3 0 0 1 3,3 v14 a3,3 0 0 1 -3,3 h-34
      a3,3 0 0 1 -3,-3 v-14 a3,3 0 0 1 3,-3 z"/>

    <!-- Headlamps. -->
    <circle cx="33" cy="59" r="5"/>
    <circle cx="63" cy="59" r="5"/>

    <!-- Skirts flaring to the rail. -->
    <path d="M25,74 l-8,10 h13 l6,-10 z"/>
    <path d="M71,74 l8,10 h-13 l-6,-10 z"/>

    <!-- Rail. -->
    <rect x="12" y="84" width="72" height="7" rx="3.5"/>
  </g>
</svg>
